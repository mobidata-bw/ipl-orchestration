name: Sync feedproviders with MobilityData systems.csv

on:
  schedule:
    - cron: '0 3 * * 0' # weekly on Sunday 03:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

env:
  SYSTEMS_CSV_URL: https://raw.githubusercontent.com/MobilityData/gbfs/refs/heads/master/systems.csv
  MOBILITYDATA_REPO: MobilityData/gbfs

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml requests

      - name: Run feed sync script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MOBILITYDATA_PAT: ${{ secrets.MOBILITYDATA_PAT }}
          SYSTEMS_CSV_URL: ${{ env.SYSTEMS_CSV_URL }}
          MOBILITYDATA_REPO: ${{ env.MOBILITYDATA_REPO }}
        run: |
          python .github/scripts/sync_feeds.py